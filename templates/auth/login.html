{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div class="text-center space-y-1">
            <div class="text-4xl mb-2">🔐</div>
            <h1 class="text-2xl font-bold text-slate-800">Welcome Back</h1>
            <p class="text-xs text-slate-500">Sign in to access your live Daily Safe-to-Spend runway</p>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required placeholder="Enter username"
                       class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Enter password"
                       class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-md transition">
                Sign In to Dashboard &rarr;
            </button>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500 space-y-2">
            <p>New to FinSentry? <a href="{% url 'register' %}" class="text-indigo-600 font-bold hover:underline">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
